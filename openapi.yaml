openapi: 3.1.0
info:
  title: Vedøy Developer API
  version: 2026-10-09
  description: Canonical API surface for Vedøy developer products, including Telnyx-backed numbers and SMS sold in Vedøy Credits.
servers:
  - url: https://vedoy-dev-portal.vercel.app/api
paths:
  /v1/health:
    get:
      summary: Service health
      security: []
      responses:
        '200': { description: API is reachable }
  /v1/projects:
    get:
      summary: List projects owned by the signed-in user
      security: [{ supabaseUser: [] }]
      responses:
        '200': { description: Project list }
    post:
      summary: Create a developer project
      security: [{ supabaseUser: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string }
      responses:
        '201': { description: Project created }
  /v1/projects/{projectId}/api-keys:
    post:
      summary: Create an API key and return the secret once
      security: [{ supabaseUser: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: API key created }
  /v1/models:
    get:
      summary: List available model routes
      security: [{ vedoyApiKey: [] }]
      responses:
        '200': { description: Model route catalog }
        '429': { description: Rate limit exceeded }
  /v1/numbers/available:
    get:
      summary: Search live Telnyx number inventory and create short-lived Vedøy quotes
      security: [{ vedoyApiKey: [] }]
      parameters:
        - in: query
          name: country
          schema: { type: string, pattern: '^[A-Z]{2}$', default: NO }
        - in: query
          name: type
          schema: { type: string, enum: [local, toll_free, mobile, national, shared_cost], default: local }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200': { description: Current customer prices and quote IDs }
        '503': { description: Telnyx is not configured }
  /v1/numbers:
    get:
      summary: List numbers owned by the API-key project
      security: [{ vedoyApiKey: [] }]
      responses:
        '200': { description: Project number list }
  /v1/numbers/purchase:
    post:
      summary: Purchase a quoted number through Telnyx
      security: [{ vedoyApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '201': { description: Number order accepted }
        '402': { description: Insufficient Vedøy Credits }
        '409': { description: Existing provider operation is pending or requires reconciliation }
        '410': { description: Quote expired }
  /v1/messages:
    post:
      summary: Send an SMS from a project-owned number through Telnyx
      security: [{ vedoyApiKey: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, text]
              properties:
                from: { type: string, pattern: '^\\+[1-9]\\d{6,14}$' }
                to: { type: string, pattern: '^\\+[1-9]\\d{6,14}$' }
                text: { type: string, minLength: 1, maxLength: 1600 }
      responses:
        '202': { description: Message accepted }
        '402': { description: Insufficient Vedøy Credits }
        '403': { description: The sending number is not owned by the project }
        '409': { description: Existing provider operation is pending or requires reconciliation }
  /v1/webhooks/endpoints:
    get:
      summary: List project webhook endpoints
      security: [{ vedoyApiKey: [] }]
      responses:
        '200': { description: Endpoint list without signing secrets }
    post:
      summary: Create a signed HTTPS webhook endpoint
      security: [{ vedoyApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string }
                description: { type: string, maxLength: 240 }
      responses:
        '201': { description: Endpoint created; signingSecret is returned once }
        '422': { description: Invalid URL or event list }
        '503': { description: Webhook signing is not configured }
  /v1/webhooks/deliveries:
    get:
      summary: List recent webhook delivery attempts
      security: [{ vedoyApiKey: [] }]
      responses:
        '200': { description: Up to 100 recent delivery attempts }
  /v1/webhooks/deliveries/{deliveryId}/retry:
    post:
      summary: Retry one webhook delivery
      security: [{ vedoyApiKey: [] }]
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Retry attempted and recorded }
        '404': { description: Delivery not found }
        '409': { description: Endpoint is disabled }
  /v1/agents:
    get:
      summary: List saved agents in the project
      security: [{ vedoyApiKey: [] }]
      responses:
        '200': { description: Agent configuration list }
    post:
      summary: Create an agent configuration with a budget guard
      security: [{ vedoyApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                instructions: { type: string, maxLength: 16000 }
                model: { type: string, default: vedoy/router }
                monthlyBudgetMicrounits: { type: integer, minimum: 0 }
                status: { type: string, enum: [draft, active], default: draft }
                metadata: { type: object }
      responses:
        '201': { description: Agent saved }
  /v1/agents/{agentId}/runs:
    get:
      summary: List recent runs for an agent
      security: [{ vedoyApiKey: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Agent run list }
    post:
      summary: Request an agent run
      description: The run is recorded as blocked until a server-side agent runner is configured.
      security: [{ vedoyApiKey: [] }]
      parameters:
        - in: path
          name: agentId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '503': { description: Agent runner is not configured; blocked run is recorded }
  /v1/usage:
    get:
      summary: List recent usage for the signed-in user's projects
      security: [{ supabaseUser: [] }]
      responses:
        '200': { description: Usage events }
  /v1/credits/balance:
    get:
      summary: Get project credit balances
      security: [{ supabaseUser: [] }]
      responses:
        '200': { description: Credit balances }
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
      description: Stable unique key for this intended provider operation. Reuse it after a timeout.
  securitySchemes:
    supabaseUser:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
    vedoyApiKey:
      type: http
      scheme: bearer
      bearerFormat: vdy_live_...

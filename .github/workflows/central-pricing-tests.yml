name: Central pricing API checks
on:
  push:
    branches: [feature/central-pricing-api]
  pull_request:
    paths:
      - "api/**"
      - "lib/public-catalog.js"
      - "tests/public-catalog.test.mjs"
      - "package*.json"
      - ".github/workflows/central-pricing-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

name: Vedoy Quantum Machines - Research Tests
on:
  push:
    branches: [feature/vedoy-quantum-machines-bb84]
    paths:
      - 'projects/vedoy-quantum-machines/**'
      - '.github/workflows/quantum-machines-tests.yml'
  pull_request:
    paths:
      - 'projects/vedoy-quantum-machines/**'
      - '.github/workflows/quantum-machines-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quantum-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/vedoy-quantum-machines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check source and browser UI
        run: |
          node --check src/word-otp.mjs
          node --check src/bb84.mjs
          node --check app.mjs
          node --check server.mjs
      - name: Run physics and encryption tests
        run: npm test
